name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the offline test suite
        env:
          OFFLINE: "1"
        run: python -m pytest tests/ -q
      - name: Prove the eval harness runs end to end
        env:
          OFFLINE: "1"
        run: python eval/run_eval.py --compare

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t caliper:ci .
